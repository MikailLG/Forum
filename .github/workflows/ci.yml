name: CI Go

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Vérifier le formatage
        run: test -z "$(gofmt -l .)"
      - name: Analyse statique
        run: go vet ./...
      - name: Compilation
        run: go build ./...