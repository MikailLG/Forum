{{define "content"}}
<h2>Forum</h2>

<form action="/forum/accueil" method="GET">
    <input type="text" name="q" placeholder="Rechercher...">
    <button type="submit">OK</button>
</form>

<form action="/forum/discussion/creer" method="POST">
    <h3>Créer un sujet</h3>
    <input type="text" name="titre" placeholder="Titre" required><br>
    <textarea name="contenu" placeholder="Message" required></textarea><br>
    <button type="submit">Publier</button>
</form>

<h3>Sujets</h3>
{{range .Discussions}}
<div style="border: 1px solid black; margin: 5px 0; padding: 5px;">
    <h4><a href="/forum/fil?id={{.ID}}">{{.Titre}}</a> (Score: {{.ScorePopularite}})</h4>
    <p>{{.Contenu}}</p>
</div>
{{else}}
<p>Aucun sujet.</p>
{{end}}

<p>
    <a href="/forum/accueil?page=1">Précédent</a> | 
    <a href="/forum/accueil?page=2">Suivant</a>
</p>
{{end}}
