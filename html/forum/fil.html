{{define "content"}}
<h2>{{.Discussion.Titre}}</h2>
<p>{{.Discussion.Contenu}}</p>

<form action="/forum/vote" method="POST" style="display:inline;">
    <input type="hidden" name="id_message" value="{{.Discussion.ID}}">
    <input type="hidden" name="type_reaction" value="like">
    <button type="submit">Like</button>
</form>

<form action="/forum/vote" method="POST" style="display:inline;">
    <input type="hidden" name="id_message" value="{{.Discussion.ID}}">
    <input type="hidden" name="type_reaction" value="dislike">
    <button type="submit">Dislike</button>
</form>

<h3>Commentaires</h3>
{{range .Commentaires}}
    <p style="background: #eee; padding: 5px;">{{.Contenu}}</p>
{{else}}
    <p>Pas de commentaire.</p>
{{end}}

<form action="/forum/commentaire/creer" method="POST">
    <input type="hidden" name="id_discussion" value="{{.Discussion.ID}}">
    <textarea name="contenu" placeholder="Votre réponse" required></textarea><br>
    <button type="submit">Répondre</button>
</form>
{{end}}
