<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
</head>
<body>
<p><a href="/forum/accueil">Retour à l'accueil</a></p>
<h1>FootConnect</h1>
{{if .Erreur}}
    <p>{{.Erreur}}</p>
{{end}}
<form action="/inscription" method="POST">
    <p>Pseudo : <input type="text" name="pseudo" required></p>
    <p>Email : <input type="email" name="email" required></p>
    <p>Mot de passe : <input type="password" name="not_de_passe" required></p>
    <p>Club de coeur : <input type="text" name="club" required></p>
    <button type="submit">S'inscrire</button>
</form>
<p>Déjà un compte ? <a href="/authentification/connexion">Se connecter</a></p>
</body>
</html>
